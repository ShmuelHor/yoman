# Weekly OpenSSF Scorecard (SECURITY.md §4): repository health such as branch
# protection, pinned dependencies and token permissions. Results go to code
# scanning and to the public Scorecard API.
#
# Publishing results restricts this workflow: no top-level env or defaults, no
# workflow-level write permissions, and only approved actions in the job.
name: Scorecard

on:
  schedule:
    - cron: "41 3 * * 1"
  push:
    branches: [main]
  branch_protection_rule:
  workflow_dispatch:
  # Validates changes to this file before they merge. PR runs never publish.
  pull_request:
    paths:
      - .github/workflows/scorecard.yml

permissions: {}

concurrency:
  group: scorecard-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      security-events: write
      # Signs the published results so the Scorecard API can verify their origin.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: scorecard.sarif
          results_format: sarif
          publish_results: ${{ github.event_name != 'pull_request' }}
      - uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: scorecard.sarif
          category: scorecard
