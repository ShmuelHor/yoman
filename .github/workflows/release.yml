# Signed release (docs/TASKS.md T06), triggered by a `v*.*.*` tag.
#
#   gate -> images -> sign -> release        zap-baseline (skipped until T52)
#
# - gate:    `npm run security:todo -- --strict`. v1.0.0 and later must pass.
#            v0.* pre-releases may still have todo security tests, so the todo
#            list is recorded as a release note instead of failing the run.
# - images:  build and push to GHCR, then pin a docker-compose.release.yml to
#            the digests. Skips with a notice until Dockerfiles exist (wave 1).
# - sign:    SPDX SBOM (Syft) and source archive, signed keyless with cosign
#            through OIDC. The only job with `id-token: write`.
# - release: GitHub Release with a generated changelog and every artifact.
#
# Manual runs (workflow_dispatch) and runs on a branch are dry runs: every stage runs except the
# release job, so the pipeline can be proven from a branch without publishing.
#
# Hardening: read-only default token, per-job permissions, SHA-pinned actions,
# digest-pinned images, no persisted git credentials, and no secrets other than
# GITHUB_TOKEN. Tag names reach the shell only through env and are validated.
name: Release

on:
  push:
    tags: ["v*.*.*"]
    # TEMPORARY (removed before merge): a workflow_dispatch can only target a
    # workflow that already exists on the default branch, so the dry run of this
    # PR is triggered by pushes to its branch. Branch pushes are dry runs.
    branches: [t06-signed-releases]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to rehearse. A dry run never publishes a release."
        required: true
        default: v0.0.0-dryrun
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # Name used in artifact file names and the SBOM.
  PROJECT: yoman

jobs:
  gate:
    name: Security todo gate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      version: ${{ steps.version.outputs.version }}
      pre-release: ${{ steps.version.outputs.pre-release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Validate the version
        id: version
        env:
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          version="${REF_NAME}"
          if [[ "${REF_TYPE}" != "tag" ]]; then
            version="${INPUT_VERSION:-v0.0.0-dryrun}"
          fi
          if [[ ! "${version}" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'${version}' is not a version like v1.2.3."
            exit 1
          fi
          # v0.* is a pre-release: the project has not reached its first stable release.
          if [[ "${version}" == v0.* ]]; then
            echo "pre-release=true" >> "${GITHUB_OUTPUT}"
          else
            echo "pre-release=false" >> "${GITHUB_OUTPUT}"
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
      - run: npm ci
      # The strict run always executes. For v1+ its failure fails the job. For
      # v0.* the failure is the point: the list of security tests that are not
      # enabled yet becomes a release note.
      - name: Run the strict gate
        env:
          PRE_RELEASE: ${{ steps.version.outputs.pre-release }}
        run: |
          set +e
          npm run security:todo -- --strict 2>&1 | tee security-todo.txt
          status="${PIPESTATUS[0]}"
          set -e
          if (( status == 0 )); then
            echo "No security tests are left to enable." | tee security-todo.txt
            exit 0
          fi
          if [[ "${PRE_RELEASE}" == "true" ]]; then
            echo "::warning title=security gate::Pre-release: the todo list is recorded in the release notes instead of failing."
            exit 0
          fi
          echo "::error title=security gate::Stable releases need every security test enabled."
          exit "${status}"
      - name: Upload the todo list
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: security-todo
          path: security-todo.txt
          if-no-files-found: error

  images:
    name: Images and pinned compose
    needs: gate
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: List Dockerfiles
        id: find
        run: |
          mapfile -d '' dockerfiles < <(git ls-files -z -- ':(glob)docker/*/Dockerfile' ':(glob)services/*/Dockerfile')
          if (( ${#dockerfiles[@]} == 0 )); then
            echo "::notice title=images::No Dockerfiles in the repository yet, skipping the image push and the pinned compose file."
            echo "found=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          printf '%s\n' "${dockerfiles[@]}" > dockerfiles.txt
          echo "found=true" >> "${GITHUB_OUTPUT}"
      # Pushing is real publishing, so a dry run builds locally and stops there.
      - name: Log in to GHCR
        if: ${{ steps.find.outputs.found == 'true' && github.ref_type == 'tag' }}
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      # PLACEHOLDER (T06): untested until the first Dockerfile exists. Each
      # image is ghcr.io/<owner>/yoman-<dir>:<version>; the digest is read back
      # from the registry and recorded in digests.txt (name, image@digest).
      - name: Build, push and record digests
        if: ${{ steps.find.outputs.found == 'true' }}
        env:
          VERSION: ${{ needs.gate.outputs.version }}
          OWNER: ${{ github.repository_owner }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          owner="${OWNER,,}"
          : > digests.txt
          while IFS= read -r dockerfile; do
            name="$(basename "$(dirname "${dockerfile}")")"
            ref="ghcr.io/${owner}/${PROJECT}-${name}"
            docker build --file "${dockerfile}" --tag "${ref}:${VERSION}" .
            if [[ "${REF_TYPE}" == "tag" ]]; then
              docker push "${ref}:${VERSION}"
              digest="$(docker inspect --format '{{index .RepoDigests 0}}' "${ref}:${VERSION}")"
              echo "${name} ${digest}" >> digests.txt
            fi
          done < dockerfiles.txt
      # PLACEHOLDER (T06): skipped until docker-compose.yml exists. Rewrites
      # every `image: ghcr.io/<owner>/yoman-<name>[:tag]` to the pushed digest.
      - name: Pin the compose file to digests
        if: ${{ steps.find.outputs.found == 'true' && github.ref_type == 'tag' && hashFiles('docker-compose.yml') != '' }}
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          owner="${OWNER,,}"
          cp docker-compose.yml docker-compose.release.yml
          while read -r name pinned; do
            sed -i -E "s#(image: *)ghcr\.io/${owner}/${PROJECT}-${name}(:[^ ]+)?\$#\1${pinned}#" docker-compose.release.yml
          done < digests.txt
          if grep -E 'image: *ghcr\.io/' docker-compose.release.yml | grep -v '@sha256:'; then
            echo "::error::A compose image is not pinned to a digest."
            exit 1
          fi
      - name: Upload digests and pinned compose
        if: ${{ hashFiles('digests.txt', 'docker-compose.release.yml') != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: images
          path: |
            digests.txt
            docker-compose.release.yml

  sign:
    name: SBOM and keyless signing
    needs: [gate, images]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      # The keyless OIDC identity for cosign. No other job gets this.
      id-token: write
    env:
      VERSION: ${{ needs.gate.outputs.version }}
      SYFT_IMAGE: ghcr.io/anchore/syft:v1.57.0@sha256:3c70e6d5979364cefdc22b51617a78fd264574d3bd6b4f84a351204147025e2a
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - name: Build the source archive and the SPDX SBOM
        run: |
          mkdir dist
          git archive --format=tar.gz --prefix="${PROJECT}-${VERSION}/" \
            --output="dist/${PROJECT}-${VERSION}-source.tar.gz" HEAD
          # Scans the checked-out tree (manifests and the lockfile), read-only.
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --env SYFT_CHECK_FOR_APP_UPDATE=false \
            --volume "${GITHUB_WORKSPACE}:/repo:ro" \
            --volume "${GITHUB_WORKSPACE}/dist:/out" \
            "${SYFT_IMAGE}" \
            scan dir:/repo \
            --source-name "${PROJECT}" --source-version "${VERSION}" \
            --output "spdx-json=/out/${PROJECT}-${VERSION}.spdx.json"
      - name: Sign the SBOM and the source archive
        run: |
          for file in "dist/${PROJECT}-${VERSION}.spdx.json" "dist/${PROJECT}-${VERSION}-source.tar.gz"; do
            cosign sign-blob --yes \
              --bundle "${file}.sigstore.json" \
              --output-signature "${file}.sig" \
              --output-certificate "${file}.pem" \
              "${file}"
          done
      # The signing identity is this workflow at the ref that ran it, so a
      # signature from any other workflow or fork fails verification.
      - name: Verify the signatures
        run: |
          for file in "dist/${PROJECT}-${VERSION}.spdx.json" "dist/${PROJECT}-${VERSION}-source.tar.gz"; do
            cosign verify-blob \
              --certificate-identity "https://github.com/${GITHUB_WORKFLOW_REF}" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              --signature "${file}.sig" \
              --certificate "${file}.pem" \
              "${file}"
            cosign verify-blob \
              --certificate-identity "https://github.com/${GITHUB_WORKFLOW_REF}" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              --bundle "${file}.sigstore.json" \
              "${file}"
          done
      # PLACEHOLDER (T06): image signing and the provenance attestation join
      # here once the images job produces digests.txt.
      - name: Upload the signed artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signed-release
          path: dist/
          if-no-files-found: error

  release:
    name: GitHub Release
    needs: [gate, images, sign]
    # Dry runs (anything but a tag) stop before publishing.
    if: ${{ github.ref_type == 'tag' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: assets
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.gate.outputs.version }}
          PRE_RELEASE: ${{ needs.gate.outputs.pre-release }}
        run: |
          {
            echo "## Security tests not yet enabled"
            echo
            echo '```text'
            cat assets/security-todo/security-todo.txt
            echo '```'
          } > notes.md
          flags=(--verify-tag --generate-notes --notes-file notes.md)
          if [[ "${PRE_RELEASE}" == "true" ]]; then
            flags+=(--prerelease)
          fi
          files=(assets/signed-release/*)
          if [[ -d assets/images ]]; then
            files+=(assets/images/*)
          fi
          gh release create "${VERSION}" "${flags[@]}" --title "${VERSION}" "${files[@]}"

  zap-baseline:
    name: ZAP baseline (ST18)
    # Skipped on purpose: the ZAP baseline needs the running stack and arrives
    # with T52 in wave 5. Delete the condition there.
    if: ${{ false }}
    needs: images
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - run: echo "TODO(T52) run the ZAP baseline against the compose stack."
