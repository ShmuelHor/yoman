# Post-merge pipeline for `main` (docs/TASKS.md T06): smoke-test the running
# compose stack.
#
# A tracked `docker-compose.yml` turns the smoke run on; without one the
# workflow is a clean no-op that says so in a notice.
#
# Hardening: read-only token, SHA-pinned actions, no persisted git credentials,
# a timeout on every job, and no secrets at all.
name: Main

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # Every push to main gets a complete run of its own.
  group: ${{ github.workflow }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  discover:
    name: Find compose file
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      compose: ${{ steps.find.outputs.compose }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Look for the compose file
        id: find
        run: |
          if git ls-files --error-unmatch docker-compose.yml > /dev/null 2>&1; then
            echo "compose=true" >> "${GITHUB_OUTPUT}"
          else
            echo "::notice title=compose smoke run::No docker-compose.yml yet, the smoke run is skipped."
            echo "compose=false" >> "${GITHUB_OUTPUT}"
          fi

  compose-smoke:
    name: Compose smoke run
    needs: discover
    if: ${{ needs.discover.outputs.compose == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # PLACEHOLDER (T06): runs only once docker-compose.yml exists. The
      # smoke and security tests against the running stack (tests/smoke and
      # the compose-level ST tests) are wired in by the task that adds them.
      # Real random secrets, as a user gets them: .env.example holds placeholders
      # that the Postgres init script refuses by design.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Create .env
        run: npm run setup
      - name: Start the stack
        run: docker compose up --detach --wait --wait-timeout 180
      # Service logs carry no secrets (pino redaction); once the runner is gone
      # they are the only clue to why a container failed.
      - name: Show container state and logs
        if: ${{ failure() }}
        run: |
          docker compose ps --all
          docker compose logs --no-color --tail 100
      - name: Tear down
        if: ${{ always() }}
        run: docker compose down --volumes
