# Blocking security gates from docs/SECURITY.md §4.
#
# Every job fails the run on a finding. Tools that speak SARIF also upload it to
# code scanning (the Security tab), so only those jobs get `security-events: write`.
#
# Hardening rules for this file (checked by actionlint below):
# - Third-party actions are pinned to a full commit SHA, container images to a digest.
# - The default token is read-only; each job asks only for what it needs.
# - Checkouts never persist the token in .git/config.
# - No pull_request_target and no continue-on-error.
name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Nightly, so new advisories against unchanged code still surface.
    - cron: "23 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gitleaks:
    name: gitleaks (full history)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # The official gitleaks image rather than gitleaks-action: on pull_request
      # the action scans only the PR's commits, and SECURITY.md requires the
      # whole history on every run. `.gitleaks.toml` at the root is picked up
      # automatically; without it gitleaks uses its default rules.
      # --log-opts=HEAD scans every commit reachable from the code under test
      # (main plus the PR). gitleaks' default, --all, would also scan every
      # other branch that fetch-depth 0 brings in, so one bad branch would fail
      # every unrelated PR. Push protection guards the other branches.
      - name: Scan every commit
        env:
          GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --env GIT_CONFIG_COUNT=1 \
            --env GIT_CONFIG_KEY_0=safe.directory \
            --env GIT_CONFIG_VALUE_0=/repo \
            --volume "${GITHUB_WORKSPACE}:/repo" \
            "${GITLEAKS_IMAGE}" \
            git /repo \
            --log-opts=HEAD \
            --redact \
            --verbose \
            --exit-code 1 \
            --report-format sarif \
            --report-path /repo/gitleaks.sarif
      # git log -p shows no diff for merge commits, so a secret added only while
      # resolving a merge conflict never appears in the history scan. Scanning
      # the tracked files of HEAD (via git archive: no .git, no ignored files)
      # catches it.
      - name: Scan the tracked files
        if: ${{ !cancelled() }}
        env:
          GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
        run: |
          tree_dir="${RUNNER_TEMP}/gitleaks-tree"
          mkdir -p "${tree_dir}"
          git archive HEAD | tar -x -C "${tree_dir}"
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --volume "${tree_dir}:/tree:ro" \
            --volume "${GITHUB_WORKSPACE}:/repo" \
            "${GITLEAKS_IMAGE}" \
            dir /tree \
            --redact \
            --verbose \
            --exit-code 1 \
            --report-format sarif \
            --report-path /repo/gitleaks-tree.sarif
      - name: Upload history SARIF
        if: ${{ !cancelled() && hashFiles('gitleaks.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: gitleaks.sarif
          category: gitleaks
      - name: Upload tracked files SARIF
        if: ${{ !cancelled() && hashFiles('gitleaks-tree.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: gitleaks-tree.sarif
          category: gitleaks-tree

  npm-audit:
    name: npm audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      # Reads package-lock.json only; nothing is installed.
      - name: Audit the lockfile
        run: npm audit --audit-level=moderate

  dependency-review:
    name: Dependency review
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          # The default scope is runtime only, and every dependency here is a
          # devDependency today, so without this the gate could never fail.
          fail-on-scopes: runtime, development, unknown
          # Copyleft licenses that would bind the whole project (SECURITY.md §4).
          deny-licenses: >-
            GPL-1.0-only, GPL-1.0-or-later, GPL-2.0-only, GPL-2.0-or-later,
            GPL-3.0-only, GPL-3.0-or-later, AGPL-1.0-only, AGPL-1.0-or-later,
            AGPL-3.0-only, AGPL-3.0-or-later, SSPL-1.0

  codeql:
    name: CodeQL
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: javascript-typescript
          build-mode: none
          config-file: ./.github/codeql/codeql-config.yml
      # Findings become code scanning alerts. The "CodeQL" code scanning check
      # on the PR fails on new error-level or high/critical security alerts.
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: codeql-javascript-typescript

  actionlint:
    name: actionlint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The official image bundles shellcheck, so run: blocks are checked too.
      - name: Lint workflows
        env:
          ACTIONLINT_IMAGE: rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        run: |
          docker run --rm \
            --volume "${GITHUB_WORKSPACE}:/repo:ro" \
            --workdir /repo \
            "${ACTIONLINT_IMAGE}" \
            -color
