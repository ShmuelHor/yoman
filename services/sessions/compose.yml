# The sessions service (T13). Internal only: it publishes no port and sits on the
# internal `core` network, where only the gateway reaches it (SECURITY A2).
# The hardening matches x-service-defaults in the root docker-compose.yml; YAML
# anchors do not cross included files, so it is repeated.
services:
  sessions:
    build:
      context: ../..
      dockerfile: docker/Dockerfile.service
      args:
        SERVICE: sessions
    # The node user of the base image (see docker/Dockerfile.service).
    user: "1000:1000"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: ["/tmp"]
    mem_limit: 128m
    cpus: 0.5
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      # infra/postgres/init creates every schema in the default database.
      DB_NAME: postgres
      SESSIONS_DB_PASSWORD: ${SESSIONS_DB_PASSWORD:?run npm run setup}
    networks: [core]
    depends_on:
      postgres:
        condition: service_healthy
