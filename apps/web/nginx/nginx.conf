# Main config for nginx-unprivileged. One worker is plenty for a single local
# user and keeps memory flat on many-core machines. Everything nginx writes goes
# to /tmp, the only writable path under the read-only root filesystem.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr notice;

events {
    worker_connections 256;
}

http {
    proxy_temp_path /tmp/proxy_temp;
    client_body_temp_path /tmp/client_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # The request id the caller sent when it is well formed (the gateway's own grammar), else
    # nginx's own, so one `grep <reqId>` finds the line and a header cannot forge a log line.
    map $http_x_request_id $trace_id {
        default                          $request_id;
        "~^[A-Za-z0-9._-]{1,64}$"        $http_x_request_id;
    }

    # One line per request: the request line only, no referrer, user agent or query string.
    log_format minimal '$time_iso8601 reqId=$trace_id $status "$request_method $uri" $body_bytes_sent';
    access_log /dev/stdout minimal;

    sendfile on;
    keepalive_timeout 65;

    include /etc/nginx/conf.d/*.conf;
}
