# Security headers for every response (SECURITY A6, ST07). Included at server
# level and in each location, because nginx drops inherited add_header lines in
# any block that sets its own. `always` also covers errors such as 404 and 405.
#
# CSP: same-origin scripts only, with no inline script and no eval. Styles may
# also be inline, because MUI's Emotion engine injects <style> rules at runtime
# (docs/SECURITY.md, "Content Security Policy (web)"). The page talks to the
# gateway on port 4711 of the same host name (SPEC §5).
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self'; font-src 'self'; connect-src 'self' http://127.0.0.1:4711 http://localhost:4711; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header X-Frame-Options "DENY" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
