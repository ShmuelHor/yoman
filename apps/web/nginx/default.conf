# Serves the built web app. nginx-unprivileged listens on 8080 as uid 101, and
# Compose publishes it on 127.0.0.1:4710 only (SECURITY A2).
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    server_tokens off;
    charset utf-8;
    client_max_body_size 1k;

    # Covers responses produced at server level, such as the 405 below.
    include /etc/nginx/snippets/security-headers.conf;

    # Static files only: nothing here accepts a request body.
    if ($request_method !~ ^(GET|HEAD)$) {
        return 405;
    }

    # Hashed file names change with their content, so they can be cached for good.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location = /healthz {
        include /etc/nginx/snippets/security-headers.conf;
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Client-side routes all load the app shell, which must never be cached stale.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}
