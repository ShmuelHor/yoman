# Yoman stack. Only 127.0.0.1:4710 (web) and 127.0.0.1:4711 (gateway) may ever be
# published (SECURITY A2); each app's and service's own compose file adds its container.
include:
  - apps/gateway/compose.yml
  - apps/web/compose.yml
  - services/sessions/compose.yml
  - services/reports/compose.yml
  - services/goals/compose.yml
  - services/battery/compose.yml
  - services/system/compose.yml
  - services/focus/compose.yml

# Hardening every container gets (SECURITY A10). Services merge it with
# `<<: *service-defaults` and set their own `user` only when the image needs one.
x-service-defaults: &service-defaults
  user: "10001:10001"
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  tmpfs: ["/tmp"]
  mem_limit: 256m
  cpus: 0.5
  restart: unless-stopped

networks:
  # No route out of the host and none in: services and the database live here.
  core:
    internal: true
  # For the gateway and web only, which must be reachable on loopback.
  edge: {}

volumes:
  pgdata: {}

services:
  postgres:
    <<: *service-defaults
    # postgres:16-alpine. Alpine's postgres user is uid/gid 70.
    image: postgres:16-alpine@sha256:aa6cb33cf4c19c765cefcf48d96176258800870a9a1e930ad126200f9d825139
    user: "70:70"
    # Deviation from the defaults, both justified: Postgres needs a writable
    # unix-socket dir (tmpfs) and data dir (the named volume). Root stays read-only.
    tmpfs:
      - /tmp
      - /var/run/postgresql:uid=70,gid=70,mode=0700
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run npm run setup}
      SESSIONS_DB_PASSWORD: ${SESSIONS_DB_PASSWORD:?run npm run setup}
      REPORTS_DB_PASSWORD: ${REPORTS_DB_PASSWORD:?run npm run setup}
      GOALS_DB_PASSWORD: ${GOALS_DB_PASSWORD:?run npm run setup}
      BATTERY_DB_PASSWORD: ${BATTERY_DB_PASSWORD:?run npm run setup}
      SYSTEM_DB_PASSWORD: ${SYSTEM_DB_PASSWORD:?run npm run setup}
      FOCUS_DB_PASSWORD: ${FOCUS_DB_PASSWORD:?run npm run setup}
      GATEWAY_DB_PASSWORD: ${GATEWAY_DB_PASSWORD:?run npm run setup}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    networks: [core]
    healthcheck:
      # Healthy only once init has finished and succeeded. During init the image
      # runs a socket-only server, hence the TCP probe. A failed init still leaves
      # an initialized data dir, so the restarted server would answer with no
      # roles; hence the check for the `gateway` schema, which init creates last.
      test:
        - CMD-SHELL
        - >-
          pg_isready -h 127.0.0.1 -U postgres -d postgres
          && psql -U postgres -d postgres -tAc
          "SELECT 1 FROM pg_namespace WHERE nspname = 'gateway'" | grep -qx 1
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
